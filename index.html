<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片工坊已搬家</title>
  <style>
    :root { --c: #365b7a; --c-soft: #eef3f8; --text: #1e293b; --muted: #64748b; --line: #e2e8f0; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: #f5f7fa; color: var(--text);
      font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .card { width: 100%; max-width: 520px; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; box-shadow: 0 10px 30px rgba(15, 23, 42, .06); }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p { margin: 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .summary { margin: 18px 0; padding: 12px 14px; border-radius: 12px; background: var(--c-soft); font-size: 13px; }
    .summary.empty { background: #f8fafc; color: var(--muted); }
    ol { margin: 0 0 18px; padding-left: 20px; }
    ol li { margin: 4px 0; }
    label.opt { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 16px; font-size: 13px; cursor: pointer; }
    label.opt input { margin-top: 3px; }
    .btns { display: flex; flex-direction: column; gap: 10px; }
    button, a.btn {
      display: block; width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--c);
      font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer;
    }
    button.primary { background: var(--c); color: #fff; }
    button.primary:disabled { opacity: .5; cursor: default; }
    a.btn { background: #fff; color: var(--c); }
    .status { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--c); }
    .status.error { color: #e11d48; }
  </style>
</head>
<body>
  <main class="card">
    <h1>图片工坊已经搬家啦</h1>
    <p class="muted">新网站需要用 Discord 登录，配置还可以云端同步。你在旧网站里保存的预设、水印、底纹、字体等数据只存在这个浏览器里，请先在这里下载备份，再导入新网站。</p>

    <div id="summary" class="summary empty">正在检查这个浏览器里的旧数据…</div>

    <ol>
      <li>点下面的「下载我的数据备份」，得到一个 <code>.json</code> 文件。</li>
      <li>打开新网站，用 Discord 登录。</li>
      <li>点右上角头像打开设置 →「导入备份」，选择刚才的文件。</li>
    </ol>

    <label class="opt">
      <input type="checkbox" id="includeQueue" />
      <span>同时备份图片队列里还没导出的图片<br /><span class="muted">图片较多时文件会比较大，一般不需要。</span></span>
    </label>

    <div class="btns">
      <button type="button" id="downloadBtn" class="primary" disabled>下载我的数据备份</button>
      <a id="goBtn" class="btn" href="#">前往新网站</a>
    </div>
    <div id="status" class="status"></div>

    <p class="muted" style="margin-top:18px">如果是在微信、QQ 等 App 里打开的，下载可能不生效，请先用手机自带的浏览器打开本页。在哪个浏览器里用过旧网站，就要在哪个浏览器里下载备份。</p>
  </main>

  <script>
    // ===== 搬家后要改的地方：新网站地址 =====
    const NEW_SITE_URL = 'https://picture-processing.asriinmiiy.workers.dev/';

    // 以下名称必须与主站 js/app.js 保持一致（备份格式见 exportFullBackup）
    const BACKUP_APP_ID = 'picture_processing';
    const BACKUP_FORMAT_VERSION = 1;
    const STORAGE_KEY = 'img_tool_state_v4';
    const BACKUP_LOCAL_STORAGE_KEYS = [STORAGE_KEY, 'wm_studio_export_seq_map_v1', 'asset_detail_view_pref_v1', 'mobile_layout_pref_v1', 'ui_appearance_v1', 'asset_lib_density_v1'];
    const BACKUP_ASSET_KEYS = ['wmLogosList', 'customPatternsList', 'bgCustomList', 'customFontsList'];
    const IDB_NAME = 'ImgToolAssetsDB';
    const IDB_STORE = 'assets';

    document.getElementById('goBtn').href = NEW_SITE_URL;

    // 不指定版本号打开，避免触发升级；数据库或表不存在时当作没有数据
    function openDB() {
      return new Promise(resolve => {
        try {
          const req = indexedDB.open(IDB_NAME);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
          req.onblocked = () => resolve(null);
        } catch (err) {
          resolve(null);
        }
      });
    }

    async function loadAsset(db, key) {
      let val = null;
      if (db && db.objectStoreNames.contains(IDB_STORE)) {
        val = await new Promise(resolve => {
          try {
            const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          } catch (err) {
            resolve(null);
          }
        });
      }
      // 很早的版本曾把素材存在 localStorage 的 asset_xxx 里
      if (val === undefined || val === null) {
        try {
          const raw = localStorage.getItem('asset_' + key);
          if (raw) val = JSON.parse(raw);
        } catch (err) {}
      }
      return Array.isArray(val) ? val : [];
    }

    async function collectBackup(includeQueue) {
      const localData = {};
      BACKUP_LOCAL_STORAGE_KEYS.forEach(k => {
        const v = localStorage.getItem(k);
        if (v !== null) localData[k] = v;
      });
      if (!includeQueue && localData[STORAGE_KEY]) {
        // 每张图的变换/擦除记录和图片队列一一对应，不带队列时一起去掉
        try {
          const main = JSON.parse(localData[STORAGE_KEY]);
          delete main.imagesTransformMeta;
          localData[STORAGE_KEY] = JSON.stringify(main);
        } catch (err) {}
      }
      const db = await openDB();
      const assets = {};
      for (const key of BACKUP_ASSET_KEYS) assets[key] = await loadAsset(db, key);
      // 没改过的内置底纹新网站自带，只保留设置，去掉图片数据
      assets.customPatternsList = assets.customPatternsList.map(t => (t && t.isBuiltin && !t.userReplaced ? { ...t, dataUrl: '' } : t));
      if (includeQueue) assets.savedQueueImagesList = await loadAsset(db, 'savedQueueImagesList');
      if (db) db.close();
      return {
        app: BACKUP_APP_ID,
        kind: 'full-backup',
        version: BACKUP_FORMAT_VERSION,
        createdAt: new Date().toISOString(),
        localStorage: localData,
        assets
      };
    }

    function describe(backup) {
      let presets = 0;
      try {
        const main = JSON.parse(backup.localStorage[STORAGE_KEY] || '{}');
        presets = ['globalPresets', 'stitchPresetsList', 'wmPresetsList', 'patternPresetsList', 'exportPresetsList']
          .reduce((n, k) => n + (Array.isArray(main[k]) ? main[k].length : 0), 0);
      } catch (err) {}
      const a = backup.assets;
      const userTex = a.customPatternsList.filter(t => t && (!t.isBuiltin || t.userReplaced)).length;
      const hasAny = Object.keys(backup.localStorage).length > 0 || a.wmLogosList.length || userTex || a.bgCustomList.length || a.customFontsList.length;
      return {
        hasAny,
        text: `检测到：${presets} 个预设，水印图章 ${a.wmLogosList.length} 个，自定义底纹 ${userTex} 个，背景图 ${a.bgCustomList.length} 张，字体 ${a.customFontsList.length} 个。`
      };
    }

    const summaryEl = document.getElementById('summary');
    const statusEl = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');

    (async () => {
      try {
        const info = describe(await collectBackup(false));
        summaryEl.textContent = info.hasAny ? info.text : '这个浏览器里没有找到旧网站的数据。如果你在别的浏览器或设备上用过，请在那里打开本页。';
        summaryEl.classList.toggle('empty', !info.hasAny);
        downloadBtn.disabled = !info.hasAny;
      } catch (err) {
        summaryEl.textContent = '读取旧数据失败：' + (err && err.message || '未知错误');
      }
    })();

    downloadBtn.addEventListener('click', async () => {
      downloadBtn.disabled = true;
      statusEl.className = 'status';
      statusEl.textContent = '正在打包…';
      try {
        const backup = await collectBackup(document.getElementById('includeQueue').checked);
        const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        const name = `图片工坊备份_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        statusEl.textContent = `已下载 ${name}（${(blob.size / 1024 / 1024).toFixed(1)} MB），接下来去新网站导入吧。`;
      } catch (err) {
        statusEl.className = 'status error';
        statusEl.textContent = '下载失败：' + (err && err.message || '未知错误');
      } finally {
        downloadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
